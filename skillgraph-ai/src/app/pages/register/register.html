<div class="container"><div class="left-panel"><h1>SkillGraph AI</h1><h3>Create Your Career Profile</h3><p>Register your profile so SkillGraph can store your career information.</p></div><div class="right-panel"><form class="register-card" (ngSubmit)="register()"><h2>Create Account</h2><input name="fullName" [(ngModel)]="profile.fullName" type="text" placeholder="Full Name" required><input name="email" [(ngModel)]="profile.email" type="email" placeholder="Email Address" required><input name="college" [(ngModel)]="profile.college" type="text" placeholder="College"><input name="branch" [(ngModel)]="profile.branch" type="text" placeholder="Branch"><input name="github" [(ngModel)]="profile.githubUsername" type="text" placeholder="GitHub Username"><input name="password" [(ngModel)]="password" type="password" placeholder="Password" required><input name="confirmPassword" [(ngModel)]="confirmPassword" type="password" placeholder="Confirm Password" required><button type="submit" [disabled]="saving">{{ saving ? 'Creating…' : 'Create Account' }}</button><p class="error" *ngIf="error">{{ error }}</p><p>Already have an account? <a routerLink="/login">Login</a></p></form></div></div>
